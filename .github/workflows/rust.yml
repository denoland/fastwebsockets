name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Build
        run: cargo build --verbose --features "upgrade,permessage-deflate,zlib-ng" --all-targets
      - name: Test
        run: cargo test --verbose --features "upgrade,permessage-deflate,zlib-ng"
      - name: Check formatting
        run: cargo fmt -- --check --verbose
      - name: Autobahn|Testsuite
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --verbose --release --features "upgrade,permessage-deflate,zlib-ng" --example echo_server
          deno run -A --unstable autobahn/server-test.js
